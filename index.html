<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Symulator Młodego Gniewnego — Tor Kielce</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="hud">
      <div>
        <p class="kicker">Tor Kielce</p>
        <h1>Symulator Młodego Gniewnego</h1>
      </div>
      <div class="stats">
        <p><span id="speed">0</span> <small>km/h</small></p>
        <p>Drift <strong id="drift">0</strong> <span id="combo">—</span></p>
        <p>Rekord <strong id="best">0</strong></p>
        <p id="pad">Podłącz pad albo użyj dotyku</p>
      </div>
      <button id="credits-btn" type="button">Twórcy</button>
    </header>
    <div id="credits" hidden>
      <div class="card">
        <h2>Twórcy</h2>
        <p>
          BMW M3 Coupe (E46) by
          <a href="https://sketchfab.com/Car2022">Mona x Supercars</a>
          is licensed under
          <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
          <a href="https://sketchfab.com/3d-models/bmw-m3-coupe-e46-f5f00aecf89845709d02be03a8007752">Model</a>.
        </p>
        <p>Tor: Tor Kielce (Miedziana Góra). Geometria © OpenStreetMap contributors, ODbL.</p>
        <button id="credits-close" type="button">Zamknij</button>
      </div>
    </div>
    <div id="touch">
      <div id="steer-pad" class="pad" role="slider" aria-label="Kierownica" aria-valuemin="-1" aria-valuemax="1"></div>
      <div class="actions">
        <button id="btn-gas" type="button" aria-label="Gaz">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 14H4z" /></svg>
        </button>
        <button id="btn-brake" type="button" aria-label="Hamulec">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="6" rx="1.5" /></svg>
        </button>
        <button id="btn-hand" type="button" aria-label="Ręczny">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20V10l5-6 5 6v10H7z" /></svg>
        </button>
        <button id="btn-reset" type="button" aria-label="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L7 8l5 5V10a5 5 0 1 1-4.3 2.5l-1.8 1A7 7 0 1 0 12 6z" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
